<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hiển thị câu xin chào qua Alert</title>
    <meta charset="utf-8">
<body>
    <p id = "name">Nguyễn Minh Triết</p>
	<script>
		const tt = document.getElementById("name");
		window.alert("Xin chào " + tt.innerHTML + "😉 Hôm nay tâm trạng bạn thế nào ?" + " Hãy chia sẽ điều đó nhé !");
	</script>
</body>
</html>
