<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Nhập thong tin bản thân </title>
    <meta charset="utf-8">
<body>
	<script>
		let name = prompt ("Hãy nhập vào tên của bạn ") ;
		let year = Number(prompt("Hãy nhập năm sinh của bạn "));
		let nae = prompt ("Hãy nhập vào sở thích của bạn ") ;
		window.alert("Xin chào " + name + ". Năm nay là năm 2026 bạn đã " + (2026-year) + " rồi đó 😉" + "và sở thích của bạn là " + nae );
	</script>
</body>
</html>
